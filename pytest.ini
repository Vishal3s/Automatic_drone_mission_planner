[pytest]
markers =
    heavy: tests that load a real embedding model / build a real Chroma index (slow, needs sentence-transformers + chromadb + network on first model download)
    live_llm: tests that call the real configured LLM provider (Groq needs GROQ_API_KEY + internet; Ollama needs `ollama serve` + `ollama pull <LLM_MODEL>`)
